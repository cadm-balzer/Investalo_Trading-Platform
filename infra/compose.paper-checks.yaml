# Explicit local fixture overlay; no ports or public deployment.
services:
  paper-fixture:
    profiles: [paper-checks]
    image: investalo-research:0.1.0-local
    restart: "no"
    user: "10003:10003"
    group_add: ["10010"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    mem_limit: 192m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
    environment:
      PAPER_WORKER_ENABLED: "1"
      PAPER_TENANT_ID: ${PAPER_TENANT_ID:?Dedicated fixture tenant required}
      PAPER_ACCOUNT_ID: ${PAPER_ACCOUNT_ID:?Dedicated fixture account required}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: investalo_credentials_checks
      PGUSER: investalo_paper_tests
      PGPASSWORD_FILE: /run/secrets/paper_fixture_password
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/secrets/local_ca_cert
      WORKER_HEALTH_FILE: /tmp/paper-health
    secrets: [paper_fixture_password, local_ca_cert]
    volumes:
      - ../services/workers/src:/app/services/workers/src:ro
      - ../packages/trading/src:/app/packages/trading/src:ro
      - ../packages/marketdata/src:/app/packages/marketdata/src:ro
    networks: [database, paper_feed_egress]
    command: [python, -m, investalo_workers.paper_main, --once]
    healthcheck:
      test: [CMD, python, -m, investalo_workers.health]
      interval: 20s
      timeout: 5s
      retries: 2

networks:
  paper_feed_egress: {}

secrets:
  paper_fixture_password:
    file: ./local/paper_test_password
