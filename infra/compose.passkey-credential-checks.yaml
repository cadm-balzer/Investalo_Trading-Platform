# Isolated synthetic purpose/API/PG/executor fixture. No existing service is
# overridden, no host ports or public flags, and no real credentials/providers.
x-purpose-check-hardened: &purpose-check-hardened
  profiles: [passkey-credential-checks]
  restart: "no"
  user: "10003:10003"
  group_add: ["10010"]
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
  logging:
    driver: none

x-purpose-api: &purpose-api
  <<: *purpose-check-hardened
  image: investalo-api:0.1.0-local
  mem_limit: 160m
  cpus: 0.3
  secrets:
    - platform_runtime_password
    - credential_flow_api_secret
    - local_ca_cert
    - api_tls_key
    - api_tls_cert
  networks: [database, passkey_credential]
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import ssl,socket; s=ssl.create_default_context(cafile='/run/secrets/local_ca_cert').wrap_socket(socket.create_connection(('127.0.0.1',8000),timeout=3),server_hostname='api'); s.sendall(b'GET /health/ready HTTP/1.1\\r\\nHost: api\\r\\nConnection: close\\r\\n\\r\\n'); assert b' 200 ' in s.recv(1024).split(b'\\r\\n',1)[0]"
    interval: 5s
    timeout: 4s
    retries: 12

x-purpose-api-environment: &purpose-api-environment
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: investalo_credentials_checks
  PGUSER: investalo_runtime
  PGPASSWORD_FILE: /run/secrets/platform_runtime_password
  PGSSLMODE: verify-full
  PGSSLROOTCERT: /run/secrets/local_ca_cert
  API_INTERNAL_AUTH_SECRET_FILE: /run/secrets/credential_flow_api_secret
  API_OIDC_ISSUER: https://auth.cockpit.local.test:8443
  API_PASSKEY_RP_ID: cockpit.local.test

services:
  credential-flow-api:
    <<: *purpose-api
    environment:
      <<: *purpose-api-environment
      API_PASSKEY_CREDENTIAL_AUTHORIZATIONS: "1"
      API_PASSKEY_ORIGIN: https://cockpit.local.test:8443

  credential-flow-disabled-api:
    <<: *purpose-api
    # Deliberately absent credential flag/origin proves the default fail-closed.
    environment: *purpose-api-environment

  credential-flow-node:
    <<: *purpose-check-hardened
    image: investalo-passkey-credential-node-checks:0.1.0-local
    build:
      context: ..
      dockerfile: infra/docker/passkey-credential-checks.Dockerfile
      target: checks
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Pinned image required}
    mem_limit: 192m
    cpus: 0.4
    environment:
      NODE_EXTRA_CA_CERTS: /run/secrets/local_ca_cert
    secrets: [local_ca_cert]
    networks: [passkey_credential]
    stdin_open: true

  credential-flow-checks:
    <<: *purpose-check-hardened
    image: investalo-local-credential-storage-checks
    build:
      context: ..
      dockerfile: infra/docker/credential-storage.Dockerfile
      target: checks
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?Pinned image required}
    mem_limit: 192m
    cpus: 0.4
    environment:
      <<: *purpose-api-environment
      API_TEST_ADMIN_USER: investalo_migration
      API_TEST_ADMIN_PASSWORD_FILE: /run/secrets/platform_migration_password
      CREDENTIAL_TEST_USER_A: investalo_credentials_tests_a
      CREDENTIAL_TEST_PASSWORD_A_FILE: /run/secrets/credentials_test_password_a
      CREDENTIAL_FLOW_API_SECRET_FILE: /run/secrets/credential_flow_api_secret
    command: [python, /app/tests/infra/check_passkey_credential_cockpit.py, --child]
    volumes:
      - ../tests/infra/check_passkey_credential_cockpit.py:/app/tests/infra/check_passkey_credential_cockpit.py:ro
    secrets:
      - platform_runtime_password
      - platform_migration_password
      - credentials_test_password_a
      - credential_flow_api_secret
      - local_ca_cert
    networks:
      database: {}
      passkey_credential:
        aliases: [credential-flow-executor.cockpit.local.test]
    stdin_open: true

networks:
  passkey_credential:
    internal: true

secrets:
  credential_flow_api_secret:
    # Prepared protected synthetic fixture identity, separate from runtime keys.
    file: /tmp/investalo-passkey-browser-state/internal-secret
