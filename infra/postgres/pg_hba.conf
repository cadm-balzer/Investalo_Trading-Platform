# Local socket bootstrap is isolated to the nonroot PostgreSQL container.
local all all trust
# All cross-container credentials use SCRAM over TLS.
hostssl investalo investalo_migration,investalo_runtime all scram-sha-256
hostssl investalo +investalo_research_worker all scram-sha-256
# A separate fixture database validates credential migrations before application
# to the ordinary development database. No real users/keys are provisioned here.
hostssl investalo_credentials_checks investalo_migration,investalo_runtime all scram-sha-256
hostssl investalo_credentials_checks +investalo_credentials_worker all scram-sha-256
hostssl investalo_credentials_checks +investalo_research_worker all scram-sha-256
hostssl investalo_credentials_checks +investalo_paper_worker all scram-sha-256
hostssl investalo_identity investalo_identity all scram-sha-256
host all all all reject
