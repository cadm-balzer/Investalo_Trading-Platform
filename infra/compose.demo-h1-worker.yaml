# User-authorized original Demo strategy worker; no live access or host port.
services:
  cockpit:
    environment:
      COCKPIT_DEMO_H1_WORKER: "1"
    group_add: ["10003"]
  demo-h1-worker:
    image: investalo-demo-trading-executor:0.1.0-local
    command: [python, -m, investalo_credential_store.demo_h1_runtime, --bitget-demo-h1-worker]
    restart: unless-stopped
    user: "10003:10003"
    group_add: ["10002"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m"]
    logging: {driver: none}
    mem_limit: 192m
    cpus: 0.5
    environment:
      DEMO_H1_WORKER_ENABLED: "1"
    volumes:
      - ./local/demo-trading-runtime/executor:/run/demo-trading-executor:ro
      - ./local/demo-h1-worker/runtime:/run/demo-h1-worker:ro
      - ./local/cockpit-public-data/demo-h1-control:/run/demo-h1-control:ro
      - ./local/demo-h1-worker/state:/app/demo-h1-state
      - ./local/cockpit-public-data/demo-h1-worker-status:/app/demo-h1-status
    secrets: [local_ca_cert]
    networks: [database, demo_h1_egress]
    depends_on:
      postgres:
        condition: service_healthy
networks:
  demo_h1_egress: {}
