[project]
name = "investalo-api"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.3",
  "psycopg[binary]==3.3.8",
  "uvicorn==0.54.0",
]

[dependency-groups]
test = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["../../tests/api"]
pythonpath = ["src"]
